<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>AI Route Optimization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <link rel="stylesheet" href="static/style.css" />
    <style>
        body { display: flex; margin: 0; height: 100vh; font-family: Arial, sans-serif; }
        #sidebar { width: 350px; background: #2c3e50; color: white; padding: 15px; z-index: 10; overflow-y: auto; }
        #map { flex: 1; height: 100%; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; cursor: pointer; font-size: 14px; margin-bottom: 15px; border-radius: 4px; }
        button:hover { background: #229954; }
        h3 { margin-top: 0; color: #3498db; }
        .summary-box { background: #34495e; padding: 12px; margin-bottom: 15px; border-radius: 4px; border-left: 4px solid #f39c12; }
        .summary-box b { color: #f39c12; }
        .summary-item { margin: 8px 0; font-size: 13px; }
        .shipper-card { background: #34495e; padding: 12px; margin: 10px 0; border-radius: 4px; border-left: 5px solid #3498db; }
        .shipper-card strong { color: #ecf0f1; }
        .shipper-card p { margin: 6px 0; font-size: 13px; color: #bdc3c7; }
        .shipper-card small { color: #95a5a6; display: block; margin-top: 8px; }
        .optimal-badge { background: #e67e22; padding: 2px 6px; border-radius: 3px; font-size: 11px; margin-left: 5px; }
        label { display: block; margin: 8px 0 4px; font-size: 13px; color: #ecf0f1; }
        input, select { width: 100%; padding: 8px 10px; border-radius: 4px; border: 1px solid #7f8c8d; background: #ecf0f1; color: #2c3e50; box-sizing: border-box; }
        input[type=number] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>🚚 Tối ưu lộ trình</h3>
        <button onclick="optimize()">Tính toán lộ trình</button>
        
        <div class="summary-box" style="background:#1abc9c;">
            <b>📝 Nhập shipper mới</b>
            <form id="customForm" onsubmit="event.preventDefault(); optimizeCustom();">
                <label>Mã shipper</label>
                <input type="text" id="shipper_id" value="6001" required />
                <label>Tên shipper</label>
                <input type="text" id="name_city" value="Nguyen Van X" required />
                <label>Mã kho hàng (city_id)</label>
                <input type="text" id="city_id" value="HN" required />
                <label>Capacity</label>
                <input type="number" id="capacity" value="80" min="1" required />
                <label>Status</label>
                <select id="status">
                    <option value="available">available</option>
                    <option value="active">active</option>
                    <option value="inactive">inactive</option>
                </select>
                <label>Speed factor</label>
                <input type="number" id="speed_factor" value="1.2" step="0.1" min="0.1" required />
                <label>Experience</label>
                <input type="number" id="experience" value="5" min="0" required />
                <label>Giờ</label>
                <input type="number" id="hour" value="6" min="0" max="23" required />
                <label>Day type</label>
                <select id="day_type">
                    <option value="normal">normal</option>
                    <option value="weekend">weekend</option>
                    <option value="holiday">holiday</option>
                </select>
                <button type="submit" style="margin-top:10px;">Tính shipper nhập tay</button>
            </form>
        </div>

        <div id="summary" style="display:none;">
            <div class="summary-box">
                <b>📊 Thông tin tối ưu</b>
                <div class="summary-item">Thời gian nhanh nhất: <span id="opt-time">-</span> phút (<span id="opt-time-shipper">-</span>)</div>
                <div class="summary-item">Chi phí thấp nhất: <span id="opt-cost">-</span> đ (<span id="opt-cost-shipper">-</span>)</div>
            </div>
        </div>
        
        <div id="list"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([16.0, 108.0], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const colors = ['#3498db', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22'];

        async function optimize() {
            try {
                const res = await fetch('/api/optimize');
                const data = await res.json();
                
                map.eachLayer((layer) => {
                    if (layer instanceof L.Marker || layer instanceof L.Polyline) {
                        map.removeLayer(layer);
                    }
                });
                
                document.getElementById('list').innerHTML = '';
                
                if (data.summary) {
                    document.getElementById('opt-time').textContent = data.summary.optimal_time.minutes;
                    document.getElementById('opt-time-shipper').textContent = data.summary.optimal_time.shipper;
                    document.getElementById('opt-cost').textContent = data.summary.optimal_cost.amount;
                    document.getElementById('opt-cost-shipper').textContent = data.summary.optimal_cost.shipper;
                    document.getElementById('summary').style.display = 'block';
                }
                
                let colorIndex = 0;
                const routes = data.routes || data;
                
                Object.entries(routes).forEach(([id, info]) => {
                    const color = colors[colorIndex % colors.length];
                    colorIndex++;

                    const shipper_name = info.shipper_name || `Shipper ${id}`;
                    const is_optimal_time = data.summary && data.summary.optimal_time.shipper === shipper_name;
                    const is_optimal_cost = data.summary && data.summary.optimal_cost.shipper === shipper_name;

                    let card_html = `
                        <div class="shipper-card" style="border-left-color: ${color}">
                            <strong>👤 ${shipper_name}</strong>
                            <p>
                                ⏱️ Thời gian: <strong>${info.total_time_minutes}</strong> phút
                                ${is_optimal_time ? '<span class="optimal-badge">TỐI ƯU</span>' : ''}
                            </p>
                            <p>
                                📏 Khoảng cách: <strong>${info.total_distance_km}</strong> km
                            </p>
                            <p>
                                💰 Chi phí: <strong>${info.total_cost}</strong> đ
                                ${is_optimal_cost ? '<span class="optimal-badge">TỐI ƯU</span>' : ''}
                            </p>
                            <small>📍 ${info.route.join(' → ')}</small>
                        </div>`;
                    
                    document.getElementById('list').innerHTML += card_html;

                    if (info.coordinates) {
                        let points = info.coordinates.map(c => [c.latitude, c.longitude]);
                        points.forEach((p, idx) => {
                            L.marker(p, {
                                title: info.route[idx] || `Điểm ${idx}`
                            }).addTo(map).bindPopup(`<b>${info.route[idx]}</b><br>Shipper: ${shipper_name}`);
                        });
                        L.polyline(points, {color: color, weight: 3, opacity: 0.7}).addTo(map);
                    }
                });
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Lỗi tính toán lộ trình!");
            }
        }

        async function optimizeCustom() {
            const shipper_id = document.getElementById('shipper_id').value;
            const name_city = document.getElementById('name_city').value;
            const city_id = document.getElementById('city_id').value;
            const capacity = document.getElementById('capacity').value;
            const status = document.getElementById('status').value;
            const speed_factor = document.getElementById('speed_factor').value;
            const experience = document.getElementById('experience').value;
            const hour = document.getElementById('hour').value;
            const day_type = document.getElementById('day_type').value;

            try {
                const res = await fetch(`/api/optimize_custom?shipper_id=${encodeURIComponent(shipper_id)}&name_city=${encodeURIComponent(name_city)}&city_id=${encodeURIComponent(city_id)}&capacity=${encodeURIComponent(capacity)}&status=${encodeURIComponent(status)}&speed_factor=${encodeURIComponent(speed_factor)}&experience=${encodeURIComponent(experience)}&hour=${encodeURIComponent(hour)}&day_type=${encodeURIComponent(day_type)}`);
                const data = await res.json();
                map.eachLayer((layer) => {
                    if (layer instanceof L.Marker || layer instanceof L.Polyline) {
                        map.removeLayer(layer);
                    }
                });
                document.getElementById('list').innerHTML = '';
                document.getElementById('summary').style.display = 'none';

                if (!res.ok) {
                    alert(data.error || 'Lỗi khi tính shipper nhập tay');
                    return;
                }

                const info = data;
                const color = colors[0];
                let card_html = `
                    <div class="shipper-card" style="border-left-color: ${color}">
                        <strong>👤 ${info.shipper_name}</strong>
                        <p>⏱️ Thời gian: <strong>${info.total_time_minutes}</strong> phút</p>
                        <p>📏 Khoảng cách: <strong>${info.total_distance_km}</strong> km</p>
                        <p>💰 Chi phí: <strong>${info.total_cost}</strong> đ</p>
                        <small>📍 ${info.route.join(' → ')}</small>
                    </div>`;
                document.getElementById('list').innerHTML = card_html;

                if (info.coordinates) {
                    const points = info.coordinates.map(c => [c.latitude, c.longitude]);
                    points.forEach((p, idx) => {
                        L.marker(p, {
                            title: info.route[idx] || `Điểm ${idx}`
                        }).addTo(map).bindPopup(`<b>${info.route[idx]}</b><br>Shipper: ${info.shipper_name}`);
                    });
                    L.polyline(points, {color: color, weight: 3, opacity: 0.7}).addTo(map);
                    if (points.length > 0) {
                        map.fitBounds(points);
                    }
                }
            } catch (error) {
                console.error(error);
                alert('Lỗi khi gọi API nhập tay');
            }
        }
    </script>
</body>
</html>
